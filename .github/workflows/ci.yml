# Quality gate: lint, typecheck and unit tests on every push and PR, plus a
# dependency audit that also runs weekly so newly published vulnerabilities
# show up as a red build even when nobody pushes.
# Needs no secrets — unit tests mock Supabase. E2E (Playwright) runs locally
# only, since it needs a logged-in session against real data.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays ~07:00/08:00 Spain
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Reads package-lock.json; no install needed. Fails on moderate or worse.
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
