# Updates investment fund NAV-based returns via fundinfo.com JSON API.
# Runs on every push to main and on demand (Actions → Run workflow).
#
# The hourly schedule lives in Supabase pg_cron (supabase/cron/update-nav.sql),
# which calls /api/cron/update-nav on time. GitHub's own schedule started runs
# 1-5 hours late, so it was dropped.
#
# Required repository secrets (in "main" environment):
#   SUPABASE_URL              — e.g. https://xxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY — service role key (bypasses RLS)

name: Update investment NAV

on:
  push:
    branches:
      - main
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  update-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: main

    steps:
      - name: Check secrets are configured
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY not configured — skipping NAV update"
            echo "SECRETS_OK=false" >> $GITHUB_ENV
          else
            echo "Secrets OK"
            echo "SECRETS_OK=true" >> $GITHUB_ENV
          fi

      - name: Checkout repository
        if: env.SECRETS_OK == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: env.SECRETS_OK == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: env.SECRETS_OK == 'true'
        run: npm ci --omit=dev

      - name: Update NAV
        if: env.SECRETS_OK == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/update-nav.mjs