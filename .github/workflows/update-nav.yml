# Updates investment fund NAV-based returns via fundinfo.com JSON API.
# Runs 7 times per day and on every push to main.
#
# Times are UTC: Spain is +1 h in winter (CET) and +2 h in summer (CEST).
#
# GitHub starts scheduled runs when it has capacity, not on the dot, and the
# queue is longest at minute 0 of each hour: runs set for :00 were starting
# 1-5 hours late. Hence the odd minutes, a little ahead of the time wanted.
#
# Required repository secrets (in "main" environment):
#   SUPABASE_URL              — e.g. https://xxx.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY — service role key (bypasses RLS)

name: Update investment NAV

on:
  push:
    branches:
      - main
  schedule:
    - cron: "47 1 * * *"    # for ~02:00 UTC (03:00 / 04:00 Spain)
    - cron: "47 4 * * *"    # for ~05:00 UTC (06:00 / 07:00 Spain)
    - cron: "47 6 * * *"    # for ~07:00 UTC (08:00 / 09:00 Spain)
    - cron: "47 8 * * *"    # for ~09:00 UTC (10:00 / 11:00 Spain)
    - cron: "7 15 * * *"    # for ~15:15 UTC (16:15 / 17:15 Spain)
    - cron: "47 16 * * *"   # for ~17:00 UTC (18:00 / 19:00 Spain)
    - cron: "47 21 * * *"   # for ~22:00 UTC (23:00 / 00:00 Spain)
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  update-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: main

    steps:
      - name: Check secrets are configured
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY not configured — skipping NAV update"
            echo "SECRETS_OK=false" >> $GITHUB_ENV
          else
            echo "Secrets OK"
            echo "SECRETS_OK=true" >> $GITHUB_ENV
          fi

      - name: Checkout repository
        if: env.SECRETS_OK == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: env.SECRETS_OK == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: env.SECRETS_OK == 'true'
        run: npm ci --omit=dev

      - name: Update NAV
        if: env.SECRETS_OK == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/update-nav.mjs